name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the unit tests with the macOS system Python
        run: /usr/bin/python3 -m unittest discover -s tests -v
